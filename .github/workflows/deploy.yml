name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The social banners are drawn with Liberation Sans (src/site/social.ts).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fonts-liberation
      # Builds the site and uploads it as the Pages artifact.
      - uses: withastro/action@v6
        with:
          node-version: 24
      - run: npm run lint:dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

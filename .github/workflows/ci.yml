name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Types, and the catalog's schemas and integrity rules.
      - run: npm run check
      - run: npm test
      # The social banners are drawn with Liberation Sans (src/site/social.ts).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fonts-liberation
      # The build runs the catalog's integrity checks over every entry.
      - run: npm run build
      # No internal link may escape the /destinoteca/ base path.
      - run: npm run lint:dist
